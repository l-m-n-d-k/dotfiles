# # C-b -> C-a
# unbind C-b
# set-option -g prefix C-a
# bind-key C-a send-prefix

# ── Основное ─────────────────────────────────────────────────
set -g default-terminal "xterm-256color"
set -as terminal-features ",*:RGB"           # truecolor (tmux >= 3.2)
set -sg escape-time 0                        # fix vim slow esc
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g base-index 1                          # окна с 1
setw -g pane-base-index 1                    # панели с 1
set -g renumber-windows on                   # без дыр после закрытия окна

bind r source-file ~/.tmux.conf \; display-message "config reloaded"

# ── Сплиты (в текущей директории) ────────────────────────────
bind /  split-window -h -c "#{pane_current_path}"
bind \\ split-window -h -c "#{pane_current_path}"
bind -  split-window -v -c "#{pane_current_path}"
bind c  new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Навигация между панелями ─────────────────────────────────
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# ── Ресайз панелей ───────────────────────────────────────────
bind -n M-H resize-pane -L 5
bind -n M-L resize-pane -R 5
bind -n M-K resize-pane -U 5
bind -n M-J resize-pane -D 5

# ─────────────────────────────────────────────────────────────
#  Everforest Dark Hard
#    bg0 #272e33   bg2 #374145   bg3 #414b50   fg #d3c6aa
#    grey0 #7a8478 grey2 #9da9a0
#    red #e67e80   orange #e69875   yellow #dbbc7f
#    green #a7c080 aqua #83c092     blue #7fbbb3
# ─────────────────────────────────────────────────────────────

set -g status-position top
set -g status-interval 5
set -g status-style "fg=#d3c6aa,bg=#272e33"

# Слева: сессия (красная, пока нажат prefix)
set -g status-left-length 40
set -g status-left "#[fg=#272e33,bold]#{?client_prefix,#[bg=#e67e80],#[bg=#a7c080]} #S #[bg=#272e33] "

# Справа: zoom, дата, время
set -g status-right-length 60
set -g status-right "#{?window_zoomed_flag,#[fg=#dbbc7f]zoom  ,}#[fg=#7fbbb3]%d.%m #[fg=#414b50]│ #[fg=#272e33,bg=#83c092,bold] %H:%M "

# Окна
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#7a8478] #I #[fg=#9da9a0]#W#[fg=#e69875]#{?window_flags,#{window_flags}, } "
setw -g window-status-current-format "#[fg=#272e33,bg=#a7c080,bold] #I #[fg=#d3c6aa,bg=#374145,bold] #W#[fg=#dbbc7f]#{?window_flags,#{window_flags}, } "

# Панели
set -g pane-border-style "fg=#374145"
set -g pane-active-border-style "fg=#a7c080"

# Сообщения и copy-mode
set -g message-style "fg=#d3c6aa,bg=#374145"
setw -g mode-style "fg=#272e33,bg=#dbbc7f"
